# example configuration

# capture_backend = "LayerShell"

# release bind
release_bind = [ "KeyA", "KeyS", "KeyD", "KeyF" ]

# optional port (defaults to 4242)
port = 4242
# optional frontend -> defaults to gtk if available
# frontend = "gtk"

# Pre-shared key for HMAC-SHA256 peer authentication.
# All peers must use the exact same string.  The raw UTF-8 bytes of this
# value are used as the HMAC key.  Can also be set via the LAN_MOUSE_AUTH_KEY
# environment variable (which takes precedence).
# WARNING: when this is absent the server operates in FAIL-CLOSED mode —
# all remote UDP events are silently rejected.
# authentication_key = "change-me-to-a-strong-secret"

# define a client on the right side with host name "iridium"
[right]
# hostname
hostname = "iridium"
# optional list of (known) ip addresses
ips = ["192.168.178.156"]

# define a client on the left side with IP address 192.168.178.189
[left]
# The hostname is optional: When no hostname is specified,
# at least one ip address needs to be specified.
hostname = "thorium"
# ips for ethernet and wifi
ips = ["192.168.178.189", "192.168.178.172"]
# optional port
port = 4242
