# 独立于上级 lan-mouse workspace 编译：clipsync 有自己的依赖集（arboard 等），
# 不属于根 [workspace].members。空 [workspace] 表让 cargo 把本 crate 当独立
# workspace root，`cargo build` 时不再向上误并入 lan-mouse 主 workspace。
[workspace]

[package]
name = "clipsync"
version = "0.1.0"
edition = "2021"
description = "Tiny bidirectional text clipboard sync between Windows and Linux/Wayland"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "io-util",
    "time",
    "macros",
    "process",
    "signal",
] }

[target.'cfg(windows)'.dependencies]
arboard = "3"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
