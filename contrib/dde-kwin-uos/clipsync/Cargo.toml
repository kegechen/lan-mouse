[package]
name = "clipsync"
version = "0.1.0"
edition = "2021"
description = "Tiny bidirectional text clipboard sync between Windows and Linux/Wayland"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "io-util",
    "time",
    "macros",
    "process",
    "signal",
] }

[target.'cfg(windows)'.dependencies]
arboard = "3"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
